[package]
name = "rugpui-editor"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "The code editor widget, with pluggable syntax highlighting"

[dependencies]
# The document. See the workspace manifest for why a rope and why these
# features.
ropey.workspace = true
# The twenty-one-slot syntax palette, the overlay scrollbars, and the text field
# the find bar is built out of.
rugpui.workspace = true

gpui.workspace = true
# One call, in the paste handler: a clipboard read that fails is the only
# failure in this crate that neither the caller nor the document can be told
# about, and a paste that silently does nothing is worth a line in the log.
log.workspace = true
# The caret moves by grapheme cluster rather than by `char`, so that a Hangul
# syllable or an emoji with a zero-width joiner in it is one cursor step -- the
# same reason `rugpui`'s text field depends on it. Here it is driven by
# `GraphemeCursor` rather than `grapheme_indices`, so that a boundary can be
# found next to an offset without walking the buffer to reach it.
unicode-segmentation.workspace = true

# --- optional, for `custom-syntax` ---
# A language defined by a YAML file rather than by code: the reader, the derive
# that drives it, and the error type `Definition::parse` answers with. All three
# are behind the feature, because a host that writes its languages in Rust
# should not link a YAML parser to do it.
anyhow = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_norway = { workspace = true, optional = true }

[features]
# Languages read from a YAML definition rather than written as a lexer. Off by
# default: it is the only thing in this crate that costs a dependency, and a
# host that ships the eighteen built-in languages and nothing else should not
# pay for it. See `lang::custom`.
custom-syntax = ["dep:anyhow", "dep:serde", "dep:serde_norway"]

[dev-dependencies]
# gpui's headless test platform. Every behaviour worth holding down here --
# input handling above all -- only exists once there is a window and a focused
# element, so the tests open one. Test-only: the library links gpui without it.
gpui = { workspace = true, features = ["test-support"] }
