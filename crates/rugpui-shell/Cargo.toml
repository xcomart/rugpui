[package]
name = "rugpui-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "The application-level shell three rugpui applications share: window chrome, the self-updater, the theme editor and the pieces around them"

[dependencies]
anyhow.workspace = true
futures.workspace = true
gpui.workspace = true
log.workspace = true
ring.workspace = true
rugpui.workspace = true
serde.workspace = true
serde_json.workspace = true
ureq.workspace = true

# `raw-window-handle` is only reached from the Windows caption code, but gpui
# re-exports the trait rather than the crate, so the dependency has to be named
# where that code can see it.
[target.'cfg(windows)'.dependencies]
raw-window-handle.workspace = true
windows.workspace = true
windows-registry.workspace = true

[dev-dependencies]
# The updater's swap, its rollback and its staged-payload path all rewrite real
# directories rather than mocking the filesystem out.
tempfile.workspace = true
# gpui's headless test platform, for the pieces that only exist once there is an
# `App` to install a global into. Test-only: the library links gpui without it.
gpui = { workspace = true, features = ["test-support"] }
